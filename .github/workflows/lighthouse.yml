name: Lighthouse (live site)

# Measures the PUBLIC pages of the deployed site on a mobile profile after every successful deploy and once a week,
# so slow third-party scripts, a heavy image or an accessibility slip shows up as a red run instead of a lost student.
on:
  workflow_run:
    workflows: [Deploy]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Lighthouse on the live pages
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The address is the SITE_URL in worker/wrangler.toml (the repository variable SITE_URL overrides it, if you set one).
      - name: Which address to measure
        id: site
        env:
          OVERRIDE: ${{ vars.SITE_URL }}
        run: echo "url=${OVERRIDE:-$(node scripts/print-site-url.mjs)}" >> "$GITHUB_OUTPUT"
      # Before the site is deployed (or while it is unreachable) there is nothing to measure: say so instead of failing
      # every Monday. A manual run still fails loudly.
      - name: Is the site live?
        id: live
        env:
          SITE: ${{ steps.site.outputs.url }}
        run: |
          body="$(curl -fsS --max-time 20 "$SITE/api/health" || true)"
          if printf '%s' "$body" | grep -q '"ok":true'; then
            echo "live=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "::error title=The site is not reachable::$SITE/api/health did not answer."
            exit 1
          else
            echo "live=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Nothing to measure yet::$SITE is not live (deployment is not set up yet, or the site is down), so Lighthouse was skipped."
          fi
      - name: Lighthouse (budgets in scripts/lighthouse-local.mjs)
        if: steps.live.outputs.live == 'true'
        env:
          CHROME_PATH: /usr/bin/google-chrome
          LH_URL: ${{ steps.site.outputs.url }}
        run: node scripts/lighthouse-local.mjs
