name: Deploy

# Push to main  →  all checks (ci.yml)  →  Cloudflare access check (token, R2, and the custom domain's zone)  →  find or create the
# database, KV and file storage  →  database migrations  →  wrangler deploy (which also attaches the custom domain)  →  secrets
# →  health check of the free address  →  check of the public address as a visitor and a search engine meet it.
# One-time setup is two repository secrets (docs/deployment.md, section 4). Nothing else has to be filled in by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once and never cancel one half way through.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Checks
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read

  # A fresh repository has no Cloudflare secrets yet. Until they exist this stops with a notice (nothing is deployed, nothing
  # turns red); a *manual* run of this workflow fails loudly instead, because then someone really wants a deploy.
  ready:
    name: Is deployment set up?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - id: check
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          problem="Add the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (docs/deployment.md, section 4)."
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "::error title=Deployment is not set up::$problem"
            exit 1
          fi
          echo "deploy=false" >> "$GITHUB_OUTPUT"
          echo "::notice title=Deployment is not set up yet, so nothing was deployed::$problem"
          { echo "### Nothing was deployed"; echo "$problem"; } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Migrate and deploy to Cloudflare
    needs: [verify, ready]
    if: needs.ready.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Optional: in GitHub → Settings → Environments → production, add "required reviewers" to approve each release.
    environment:
      name: production
      url: ${{ steps.site.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # The address the site is meant to open at (SITE_URL), and its www twin when the Worker is attached to that name too.
      - name: Which address is the site meant to open at?
        id: site
        run: |
          echo "url=$(node scripts/print-site-url.mjs)" >> "$GITHUB_OUTPUT"
          echo "www=$(node scripts/print-site-url.mjs --www)" >> "$GITHUB_OUTPUT"

      # Read-only. Says in plain words if the token lacks a permission, R2 is off, the account ID is another account's, or a
      # custom domain cannot be attached (its zone is missing or inactive, the token may not manage routes, a DNS record is in the way).
      - name: Check the Cloudflare access (changes nothing)
        run: node scripts/ci-preflight.mjs

      - run: npm ci

      - name: Build (public site, student app, admin)
        run: npm run build

      # The two placeholder IDs in worker/wrangler.toml are filled in here, for this run only (nothing is committed).
      # Creates the D1 database, KV namespace and R2 bucket the first time; afterwards it only finds them.
      - name: Find or create the database, KV storage and file storage
        run: node scripts/setup-cloudflare.mjs --ci

      - name: Remember the database restore point
        working-directory: worker
        run: |
          echo "### Database restore point (before this release's migrations)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler d1 time-travel info DB 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "To roll the data back: npx wrangler d1 time-travel restore DB --bookmark <bookmark above>  (docs/security.md → Backup and restore)" >> "$GITHUB_STEP_SUMMARY"

      - name: Apply database migrations
        working-directory: worker
        run: npx wrangler d1 migrations apply DB --remote

      - name: Deploy the Worker and its static assets
        id: deploy
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          title="$(git log -1 --pretty=%s)"
          npx wrangler deploy --message "GitHub: ${title:0:80} (${GITHUB_SHA::7})" 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          # the address Cloudflare just published; the SITE_URL from wrangler.toml if Cloudflare printed none
          url="$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -1 || true)"
          [ -n "$url" ] || url="$(node ../scripts/print-site-url.mjs)"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # APP_SECRET is made here (random, never shown) if the Worker has none, and SETUP_TOKEN is taken from the repository secret of that
      # name (optional) — an existing APP_SECRET or SETUP_TOKEN is never replaced. RESEND_API_KEY (the e-mail key) is the exception: when
      # the repository secret of that name looks like a Resend key it is set on the Worker at every deploy, so changing or rotating the
      # key is one edit of the GitHub secret and one run of Deploy. With no such GitHub secret, a key set in Cloudflare is left alone.
      # The same goes for SMS_API_KEY / SMS_API_URL (the SMS company), SSLCOMMERZ_STORE_ID / SSLCOMMERZ_STORE_PASSWORD (online payments) and
      # GA4_SERVICE_ACCOUNT_JSON (the whole key file of the Google service account that reads the Analytics numbers for Admin → Analytics).
      - name: Give the Worker its secrets
        env:
          SETUP_TOKEN: ${{ secrets.SETUP_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMS_API_KEY: ${{ secrets.SMS_API_KEY }}
          SMS_API_URL: ${{ secrets.SMS_API_URL }}
          SSLCOMMERZ_STORE_ID: ${{ secrets.SSLCOMMERZ_STORE_ID }}
          SSLCOMMERZ_STORE_PASSWORD: ${{ secrets.SSLCOMMERZ_STORE_PASSWORD }}
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
        run: node scripts/setup-cloudflare.mjs --ci --no-resources --secrets

      # The free workers.dev address answers as soon as the code is published, whatever state the custom domain is in.
      - name: Health check (the free address)
        shell: bash
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          for attempt in $(seq 1 12); do
            body="$(curl -fsS --max-time 20 "$URL/api/health" || true)"
            if printf '%s' "$body" | grep -q '"ok":true'; then
              echo "healthy: $URL"
              exit 0
            fi
            echo "not ready yet (attempt $attempt) …"
            sleep 10
          done
          echo "::error::$URL/api/health did not report healthy after the deploy"
          exit 1

      # A new domain needs a few minutes for its DNS record and certificate, so this waits (up to 10 minutes) and then looks at the
      # public address the way a visitor and a search engine do: pages, canonical links, robots.txt, sitemap, https and www redirects.
      - name: Check the public address
        shell: bash
        env:
          SITE: ${{ steps.site.outputs.url }}
          WWW: ${{ steps.site.outputs.www }}
          FREE: ${{ steps.deploy.outputs.url }}
        run: |
          args=(--free "$FREE")
          [ -z "$WWW" ] || args+=(--www "$WWW")
          node scripts/smoke-live.mjs "$SITE" "${args[@]}"

      - name: Where to open it
        run: |
          {
            echo "### ✅ Deployed"
            echo
            echo "Site: ${{ steps.site.outputs.url }}"
            echo "Admin: ${{ steps.site.outputs.url }}/admin/"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: What to check if this failed
        if: failure()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### ❌ The deploy did not finish

          The site keeps serving the version it had before. Open the red step above to read Cloudflare's own message, then check:

          1. **"Check the Cloudflare access"** failed: follow the ✗ lines (a missing token permission, R2 not switched on, or an account ID that belongs to another Cloudflare account).
          2. **"Find or create the database, KV storage and file storage"** failed: R2 must be switched on once (Cloudflare dashboard → R2 → Overview), and the API token needs *D1 · Edit*, *Workers KV Storage · Edit* and *Workers R2 Storage · Edit* as well as *Workers Scripts · Edit*.
          3. **Migrations or "Deploy the Worker"** failed: read the message. If it mentions Stream, switch Stream on in the Cloudflare dashboard.
          4. **"Health check (the free address)"** failed: the code was published but the site answers with an error. Open the address and add `/api/health`.
          5. **"Check the public address"** failed: the release is published and the free address works. Read the ❌ lines in the summary. For a new domain the usual causes are a DNS record or certificate that is not ready yet (wait ten minutes and run Deploy again) or a DNS record that already existed on that name (Cloudflare dashboard → the domain → DNS → Records).
          6. **A domain problem** in "Check the Cloudflare access" or "Deploy the Worker" (the zone is not found or not active, "Workers Routes", "externally managed DNS records"): the API token needs *Zone → Workers Routes → Edit* and *Zone → Zone → Read* for the domain's zone (My Profile → API Tokens → your token → Edit → Zone Resources → Include → All zones), and the domain must be listed under Websites in this account.
          7. Cloudflare's own **Workers Builds** (the Git connection under Worker → Settings → Builds) is not used by this project and fails on it. Disconnect it there.

          More: docs/deployment.md, sections 4 and 8.
          EOF
