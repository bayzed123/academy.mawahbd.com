name: Deploy

# Push to main  →  all checks (ci.yml)  →  database migrations  →  wrangler deploy  →  health check.
# One-time setup (repository secrets, environment, Cloudflare resources) is in docs/deployment.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once and never cancel one half way through.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Checks
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read

  # A fresh repository has no Cloudflare secrets yet. Until they exist this stops with a notice (nothing is deployed, nothing
  # turns red); a *manual* run of this workflow fails loudly instead, because then someone really wants a deploy.
  ready:
    name: Is deployment set up?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          problem=""
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            problem="Add the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (docs/deployment.md, step 6)."
          elif grep -q "REPLACE_WITH" worker/wrangler.toml; then
            problem="worker/wrangler.toml still contains placeholder IDs. Run 'npm run setup:cloudflare' and commit the result (docs/deployment.md)."
          fi
          if [ -z "$problem" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "::error title=Deployment is not set up::$problem"
            exit 1
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deployment is not set up yet, so nothing was deployed::$problem"
            echo "### Nothing was deployed" >> "$GITHUB_STEP_SUMMARY"
            echo "$problem" >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    name: Migrate and deploy to Cloudflare
    needs: [verify, ready]
    if: needs.ready.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Optional: in GitHub → Settings → Environments → production, add "required reviewers" to approve each release.
    environment:
      name: production
      url: ${{ vars.SITE_URL || 'https://academy.mawahbd.com' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE: ${{ vars.SITE_URL || 'https://academy.mawahbd.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Build (public site, student app, admin)
        run: npm run build

      - name: Remember the database restore point
        working-directory: worker
        run: |
          echo "### Database restore point (before this release's migrations)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler d1 time-travel info DB 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "To roll the data back: npx wrangler d1 time-travel restore DB --bookmark <bookmark above>  (docs/security.md → Backup and restore)" >> "$GITHUB_STEP_SUMMARY"

      - name: Apply database migrations
        working-directory: worker
        run: npx wrangler d1 migrations apply DB --remote

      - name: Deploy the Worker and its static assets
        working-directory: worker
        run: npx wrangler deploy

      - name: Health check
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS "$SITE/api/health" | grep -q '"ok":true'; then
              echo "healthy: $SITE"
              exit 0
            fi
            echo "not ready yet (attempt $attempt) …"
            sleep 10
          done
          echo "::error::$SITE/api/health did not report healthy after the deploy"
          exit 1
